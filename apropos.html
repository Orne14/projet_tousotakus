<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/styles.css">
    <title>A propos</title>
</head>
<body>
    <header>
        <div class="nav-wrap">
            <div class="logo">
                <img src="./images/logo.jpeg " alt="TOUSOTAKUS" class="logo-img">
                <span class="logo-text">TOUSOTAKUS</span>
            </div>

            <nav>
                <ul>
                    <li><a href="./index.html">Accueil</a></li>
                    <li><a href="./boutique.html">Boutique</a></li>
                    <li><a href="./apropos.html">À propos</a></li>
                    <li><a href="./contact.html">Contact</a></li>
                </ul>
            </nav>

            <div class="nav-actions">
                <button class="cart-btn" onclick="toggleCart(true)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-count">0</span>
                </button>
                <a href="#contact" class="cta-btn">Contactez-nous</a>
            </div>
            <!-- Panier -->
            <div class="overlay" id="overlay" onclick="toggleCart(false)"></div>
                <div class="cart-panel" id="cart-panel">
                    <div class="cart-head">
                        <h3>Ta sélection</h3>
                        <button class="cart-close" onclick="toggleCart(false)">✕</button>
                    </div>
                <div class="cart-items" id="cart-items"></div>
                <div class="cart-foot">
                    <div class="cart-total"><span>Total</span><span id="cart-total">0 FCFA</span></div>
                    <a class="btn" id="wa-checkout" href="#" target="_blank">Commander via WhatsApp</a>
                </div>
            </div>
        </div>
    </header>

    <!-- header-->
     <section class="page-hero" id="apropos-hero">
        <div class="page-hero-overlay"></div>
        <div class="page-hero-content reveal">
            <span class="page-hero-tag reveal-group">Notre Histoire</span>
            <h1>L'esprit TOUSOTAKUS</h1>
            <p>Une passion pour l'univers otaku, transformée en une sélection pensée pour les vrais fans.</p>
        </div>
    </section>


</body>
</html>
